framework:
    rate_limiter:
        # Envios de los formularios publicos (contacto, eventos, casos de soporte)
        # por IP. Se inyecta como RateLimiterFactoryInterface $formularioPublicoLimiter.
        # Los contadores quedan en la cache de la app (var/cache).
        formulario_publico:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Consultas del estado de un caso de soporte, por IP. Frena a quien
        # intente adivinar numeros de caso y correos.
        consulta_caso:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
